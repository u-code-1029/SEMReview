[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sem-review"
version = "0.2.0"
description = "Local SEM sequence annotation, boundary learning, and reversible review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "numpy>=2,<3",
  "tifffile>=2025.1",
  "imagecodecs>=2025.1",
  "scikit-image>=0.25,<1",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "safetensors>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.11", "pyinstaller>=6.12"]

[project.scripts]
sem-review = "semreview.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
